name: stage3-deploy-staging
on:
  push:
    branches: [release-dev]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed playbooks
        id: detect
        run: |
          PB=$(git diff --name-only HEAD^ HEAD | grep -E '^[^/]+\.ya?ml$' | jq -R . | jq -sc .)
          [ "$PB" = "[]" ] && PB='["resource-report.yml"]'   # fallback: full site
          echo "playbooks=$PB" >> "$GITHUB_OUTPUT"
      - name: Point project at release-dev
        env:
          T: ${{ secrets.ANSIBLE_CONTROLLER_TOKEN }}
          BASE: ${{ vars.ANSIBLE_CONTROLLER_URL }}/api/v1
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Token $T" -H "Content-Type: application/json" \
               -X PATCH "$BASE/projects/${{ vars.PROJECT_ID_STAGING }}/" \
               -d "$(jq -nc --arg b "${{ github.ref_name }}" '{git_branch:$b}')"

      - name: Deploy each
        env:
          T: ${{ secrets.ANSIBLE_CONTROLLER_TOKEN }}
          BASE: ${{ vars.ANSIBLE_CONTROLLER_URL }}/api/v1
        run: |
          set -euo pipefail
          for PB in $(jq -r '.[]' <<<'${{ steps.detect.outputs.playbooks }}'); do
            echo "::group::Deploying $PB"
            JID=$(curl -fsS -H "Authorization: Token $T" -H "Content-Type: application/json" \
                         -X POST "$BASE/projects/${{ vars.PROJECT_ID_STAGING }}/launch/" \
                         -d "$(jq -nc --arg pb "$PB" \
                                       --argjson inv ${{ vars.INVENTORY_ID_STAGING }} \
                                       --argjson cid ${{ vars.SSH_CREDENTIAL_ID_STAGING }} \
                                       '{playbook:$pb, inventory_id:$inv, credential_ids:[$cid]}')" \
                  | jq -r .job_id)
            for i in $(seq 1 360); do
              S=$(curl -fsS -H "Authorization: Token $T" "$BASE/jobs/$JID/" | jq -r .status)
              case "$S" in success|failed|canceled) break;; esac; sleep 5
            done
            curl -fsS -H "Authorization: Token $T" "$BASE/jobs/$JID/log/" | jq -r .stdout
            [ "$S" = "success" ] || { echo "::error::$PB → $S (job $JID)"; exit 1; }
            echo "::endgroup::"
          done